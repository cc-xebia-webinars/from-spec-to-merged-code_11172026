name: CI

# Every pull request has to pass the whole test suite before anyone merges it, whether a person or
# an agent wrote the change.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # --locked fails if uv.lock doesn't match pyproject.toml, so an unreviewed dependency
      # change can't slip through.
      - name: Install dependencies
        run: uv sync --locked
      - name: Run the tests
        run: uv run pytest
